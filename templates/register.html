{% extends "base.html" %}{% block title %}Create account | CareerTrack{% endblock %}
{% block content %}
<div class="auth-card">
  <a class="brand" href="{{ url_for('register') }}">Career<span>Track</span></a>
  <p class="eyebrow">START WITH A CLEAR PLAN</p>
  <h1>Create your account</h1><p class="muted">Your applications and interview notes stay in your account.</p>
  <form method="post" class="stack">
    <label>Full name<input name="name" required placeholder="Your name"></label>
    <label>Email address<input type="email" name="email" required placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" minlength="6" required placeholder="At least 6 characters"></label>
    <button class="btn primary full">Create account</button>
  </form>
  <p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
